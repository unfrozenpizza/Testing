# Bluetooth Subsystem
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Silvershield"

# Bluetooth Settings
CONFIG_BT_MAX_CONN=1
CONFIG_BT_L2CAP_TX_BUF_COUNT=5

# Bluetooth Mesh (mesh_alerts.c): alerts are also published to the mesh, alongside the GATT link.
# Extended advertising lets mesh and the connectable "Silvershield" advertising run at the same time.
CONFIG_BT_OBSERVER=y
CONFIG_BT_BROADCASTER=y
CONFIG_BT_EXT_ADV=y
CONFIG_BT_EXT_ADV_MAX_ADV_SET=3
CONFIG_BT_MESH=y
CONFIG_BT_MESH_RELAY=y
CONFIG_BT_MESH_PB_ADV=n
CONFIG_BT_MESH_CFG_CLI=y
CONFIG_BT_MESH_SUBNET_COUNT=1
CONFIG_BT_MESH_APP_KEY_COUNT=1
CONFIG_BT_MESH_MODEL_GROUP_COUNT=1
# 1 + 4 copies of each alert, so one lost packet doesn't lose the alert
CONFIG_BT_MESH_NETWORK_TRANSMIT_COUNT=4
CONFIG_HWINFO=y

# Saved settings (mesh network keys and address survive a reboot)
CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
# k_poll in the BLE sender thread (wait for new alerts or a subscriber)
CONFIG_POLL=y

# C++ Standard Library & Exceptions for Edge Impulse
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_GLIBCXX_LIBCPP=y
CONFIG_CPP_EXCEPTIONS=y

# Floating Point Support for Edge Impulse
CONFIG_CBPRINTF_FP_SUPPORT=y

# Stack Size for System Workqueue
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# Heap Allocation for dynamic memory (new/delete)
CONFIG_HEAP_MEM_POOL_SIZE=32768

# Audio & Digital Microphone Drivers
CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y

# Radar UART (interrupt-driven receive)
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_RING_BUFFER=y

# Hardware floating point for the Edge Impulse MFCC/inference (was soft-float).
# FPU_SHARING because the AI and audio threads both use float.
CONFIG_FPU=y
CONFIG_FPU_SHARING=y
