# Bluetooth Subsystem
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Silvershield"

# Bluetooth Settings
CONFIG_BT_MAX_CONN=1
CONFIG_BT_L2CAP_TX_BUF_COUNT=5
CONFIG_BT_LOG_LEVEL_INF=y

# C++ Standard Library & Exceptions for Edge Impulse
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_GLIBCXX_LIBCPP=y
CONFIG_CPP_EXCEPTIONS=y

# Floating Point Support for Edge Impulse
CONFIG_CBPRINTF_FP_SUPPORT=y

# Stack Size for System Workqueue
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# Heap Allocation for dynamic memory (new/delete)
CONFIG_HEAP_MEM_POOL_SIZE=32768

# Logging buffer size for printk
CONFIG_PRINTK_BUFFER_SIZE=4096

# Audio & Digital Microphone Drivers
CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y

# Radar UART (interrupt-driven receive)
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_RING_BUFFER=y
